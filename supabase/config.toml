# Supabase config for Larvis: the local development stack (`supabase start`).
# Production runs the self-hosted stack from deploy/supabase/docker-compose.yml.
project_id = "larvis"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[realtime]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Single-account app: keep public signups disabled. Users are created via the
# auth admin API (see README, "Schnellstart lokal").
enable_signup = false

[auth.email]
# enable_signup here must stay true: in the CLI it switches the whole email
# provider (including password and code logins). [auth].enable_signup above
# already blocks new accounts.
enable_signup = true
enable_confirmations = false
