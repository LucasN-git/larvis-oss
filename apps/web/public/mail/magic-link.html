<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dein Larvis-Code</title>
</head>
<body style="margin:0;padding:0;background:#edeef0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#edeef0;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#ffffff;border-radius:16px;padding:32px 28px;">
          <tr>
            <td style="font-size:20px;font-weight:700;letter-spacing:-0.02em;padding-bottom:16px;">Larvis</td>
          </tr>
          <tr>
            <td style="font-size:15px;line-height:1.5;padding-bottom:20px;">
              Mit diesem Code meldest du dich bei Larvis an. Tipp ihn auf der Anmeldeseite ein.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <div style="display:inline-block;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:36px;font-weight:700;letter-spacing:8px;padding:14px 20px;background:#f3f4f6;border-radius:12px;user-select:all;-webkit-user-select:all;">{{ .Token }}</div>
            </td>
          </tr>
          <tr>
            <td style="font-size:13px;line-height:1.5;color:#6b7280;">
              Der Code gilt 10 Minuten. Hast du keine Anmeldung angefordert, ignorier diese Mail einfach.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
